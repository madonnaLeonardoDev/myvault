[package]
name = "myvault"
version = "1.0.0"
edition = "2024"

# Expose shared code as a library
[lib]
name = "myvault"
path = "src/lib.rs"

# Main CLI binary
[[bin]]
name = "myvault"
path = "src/main.rs"

# Daemon binary for browser extension
[[bin]]
name = "vault_daemon"
path = "src/browser_daemon/mod.rs"

[dependencies]
rpassword = "7.5.4"
zeroize = { version = "1.9.0", features = ["derive", "serde"] }
argon2 = "0.5.3"
rand = "0.8.7"
aes-gcm = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
toml = "0.8"
clap = { version = "4.6.6", features = ["derive"] }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
fuzzy-matcher = "0.3.7"
clap_complete = "4.6.9"
